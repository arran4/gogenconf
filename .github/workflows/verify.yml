name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go generate ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race ./...
      - run: go mod tidy
      - run: git diff --exit-code
